name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/**"
      - "architecture/**"
      - "README.md"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/**"
      - "architecture/**"
      - "README.md"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

# Least privilege: workflow only needs to read repository contents.
permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, migrate, seed and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff format check
        run: python -m ruff format --check app tests

      - name: Ruff lint
        run: python -m ruff check app tests

      - name: App imports without database or Azure
        env:
          AI_ENABLED: "false"
        run: python -c "from app.main import app; print('APP_IMPORT_OK')"

      - name: Alembic upgrade (disposable SQLite)
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: python -m alembic upgrade head

      - name: Alembic check (models match migrations)
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: python -m alembic check

      - name: Seed validation (idempotent)
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          python -m app.db.seed
          python -m app.db.seed

      - name: Backend tests
        run: python -m pytest tests -q

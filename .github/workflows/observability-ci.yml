name: Observability & AI Quality CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-quality-gate:
    name: AI quality + observability (deterministic, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff format check
        run: python -m ruff format --check app tests

      - name: Ruff lint
        run: python -m ruff check app tests

      - name: Focused observability tests
        run: python -m pytest tests/observability -q

      - name: Focused AI-evaluation tests
        run: python -m pytest tests/ai_quality -q

      # Domain-telemetry integration must run in Prompt 8 CI (not only unit
      # recorder tests). Exit code 5 (no tests collected) fails the job.
      - name: Domain telemetry integration (runtime call sites)
        run: >
          python -m pytest
          tests/enterprise/test_connector_ingestion_telemetry.py
          tests/graph/test_graph_telemetry.py
          tests/prediction/test_prediction_telemetry.py
          tests/prediction/test_prediction_validation_telemetry.py
          tests/scenarios/test_scenario_telemetry.py
          tests/chief_of_staff/test_cos_telemetry.py
          tests/chief_of_staff/test_cos_review_telemetry.py
          tests/persistence/test_review_telemetry.py
          tests/security/test_audit_health_telemetry.py
          tests/observability/test_domain_integration_flow.py
          tests/observability/test_pending_uow_telemetry.py
          -q

      # The release gate MUST return non-zero on any critical safety violation.
      # No `|| true` / `continue-on-error`: a failure fails the job.
      - name: AI release gate (deterministic, no live LLM)
        run: python -m app.observability evaluate-ai-quality --tenant-id release-tenant


      - name: Migration lifecycle (single head + alembic check)
        run: |
          python -m alembic heads
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade -1
          python -m alembic upgrade head

  observability-postgres:
    name: PostgreSQL Prompt 8 RLS tests (non-superuser role)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signalforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_MIGRATION_URL: postgresql+psycopg://postgres:postgres@localhost:5432/signalforge
      POSTGRES_TEST_URL: postgresql+psycopg://signalforge_app:app_password@localhost:5432/signalforge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install "psycopg[binary]==3.2.3"

      - name: Create non-superuser application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d signalforge -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'signalforge_app') THEN
              CREATE ROLE signalforge_app LOGIN PASSWORD 'app_password' NOSUPERUSER NOBYPASSRLS;
            END IF;
          END
          $$;
          GRANT CONNECT ON DATABASE signalforge TO signalforge_app;
          GRANT USAGE ON SCHEMA public TO signalforge_app;
          SQL

      - name: Run migrations as privileged role
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: ${{ env.POSTGRES_MIGRATION_URL }}

      - name: Grant application role table privileges (no ownership, RLS enforced)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d signalforge -v ON_ERROR_STOP=1 <<'SQL'
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO signalforge_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO signalforge_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO signalforge_app;
          SQL

      - name: Mandatory Prompt 8 PostgreSQL RLS tests
        # POSTGRES_TEST_URL is always set here, so these tests are NEVER skipped in CI.
        # pytest exit code 5 (no tests collected) fails the job — zero-test guard.
        run: python -m pytest tests/observability_postgres -q

  python-audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit==2.9.0

      - name: Audit runtime dependencies (includes OpenTelemetry)
        run: pip-audit -r requirements.txt --strict

  frontend-observability:
    name: Frontend observability dashboard (tests + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --run

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
